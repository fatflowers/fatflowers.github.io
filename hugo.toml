baseURL = "/"
theme = "PaperMod"
googleAnalytics = "G-GZGV3E1GNH"
enableEmoji = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  lineNos = true
  lineNumbersInTable = true
  tabWidth = 4

# Hugo 0.165's JSON minifier rejects valid multi-value JSON-LD emitted by the
# pinned PaperMod theme. Keep JSON untouched while still minifying HTML/CSS/JS.
[minify]
  disableJSON = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  author = "Simon Sun"
  defaultTheme = "auto"
  displayFullLangName = true

  # Post display
  ShowReadingTime = true
  ShowShareButtons = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowToc = true
  TocOpen = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true


[languages.en]
  weight = 1
  languageName = "English"
  title = "Simon Sun"

  [languages.en.params]
    [[languages.en.params.socialIcons]]
      name = "github"
      url = "https://github.com/fatflowers"

    [[languages.en.params.socialIcons]]
      name = "rss"
      url = "/index.xml"

    [languages.en.params.homeInfoParams]
      Title = "Hi, I am Simon Sun"
      Content = "AI Engineering | Backend Developer | Open Source Enthusiast"

  [[languages.en.menus.main]]
    name = "Original Tech"
    url = "/categories/original-tech"
    weight = 1

  [[languages.en.menus.main]]
    name = "Curated Reads"
    url = "/categories/curated-reads"
    weight = 2

  [[languages.en.menus.main]]
    name = "Sources"
    url = "/sources/"
    weight = 3

  [[languages.en.menus.main]]
    name = "How It Works"
    url = "/how-it-works/"
    weight = 4

  [[languages.en.menus.main]]
    name = "Archives"
    url = "/archives"
    weight = 5

  [[languages.en.menus.main]]
    name = "Search"
    url = "/search"
    weight = 6

  [[languages.en.menus.main]]
    name = "Tags"
    url = "/tags"
    weight = 7

