<figure class="raft-lab raft-model" aria-labelledby="raft-model-caption">
  <figcaption id="raft-model-caption"><span class="raft-lab-number">MODEL MAP</span><strong>协作对象与执行上下文</strong><small>普通频道的主要关系 · 标签说明数量与关联方式</small></figcaption>
  <div class="raft-model-space"><strong>Server · 协作空间</strong><span>Agent、Channel 与 Machine 都记录 serverId</span></div>
