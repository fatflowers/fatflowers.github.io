version: 1
timezone: Asia/Shanghai
content_policy: intelligence/config/content-policy.yaml

high_signal_lark:
  enabled: true
  delivery_stage: post_analysis
  identity: bot
  chat_id: oc_6a65bd218e5dd85031c2d04814de54e1
  minimum_importance: 4
  require_evidence: true
  require_verified_publication_date: true
  suppress_if_recently_published: true
  audit_action: lark.high_signal_sent
  retry_limit: 2
  message_fields:
    - headline
    - target
    - published_at
    - summary
    - why_it_matters
    - primary_source_url

report_lark:
  enabled: true
  delivery_stage: post_publication_verification
  identity: bot
  chat_id: oc_6a65bd218e5dd85031c2d04814de54e1
  editions: [morning, midday, evening, weekly, ad-hoc]
  audit_action: lark.report_sent
  retry_limit: 2
  message_fields:
    - title
    - edition
    - period
    - description
    - item_count
    - published_url

report_skip_lark:
  enabled: true
  identity: bot
  chat_id: oc_6a65bd218e5dd85031c2d04814de54e1
  editions: [morning, evening]
  audit_action: lark.report_skipped
  retry_limit: 2
  message_fields:
    - edition
    - period
    - reason
    - latest_collection_status

feed_lark:
  enabled: true
  delivery_stage: post_publication_verification
  identity: bot
  chat_id: oc_6a65bd218e5dd85031c2d04814de54e1
  debounce_minutes: 5
  minimum_importance: 2
  audit_action: lark.feed_batch_sent
  page_url: https://fatflowers.github.io/zh/feed/
  max_headlines_per_message: 10
