version: 1
metadata:
  name: personal-intelligence-catalog
  description: 个人公开情报系统首批目标、频道与稳定标签
  owner: Simon Sun
  default_language: zh-CN
  public_only: true

tags:
  - {slug: competitor, name: 竞品, type: relationship}
  - {slug: ecosystem-partner, name: 生态伙伴, type: relationship}
  - {slug: opinion-leader, name: 意见领袖, type: relationship}
  - {slug: tech-giant, name: 科技大厂, type: organization}
  - {slug: startup, name: 创业公司, type: organization}
  - {slug: open-source-community, name: 开源社区, type: organization}
  - {slug: agent-resource-layer, name: Agent资源层, type: sector}
  - {slug: agent-infrastructure, name: Agent基础设施, type: sector}
  - {slug: agent-platform, name: Agent平台, type: sector}
  - {slug: developer-platform, name: 开发者平台, type: sector}
  - {slug: model-layer, name: 模型层, type: sector}
  - {slug: tool-integration, name: 工具集成, type: sector}
  - {slug: ai-engineering, name: AI工程, type: sector}
  - {slug: ai-safety, name: AI安全, type: sector}
  - {slug: interoperability, name: 互操作性, type: sector}
  - {slug: open-protocol, name: 开放协议, type: sector}
  - {slug: mcp, name: MCP, type: technology}
  - {slug: sdk, name: SDK, type: technology}
  - {slug: llm, name: LLM, type: technology}
  - {slug: open-source, name: 开源, type: technology}
  - {slug: ecosystem-registry, name: 生态注册表, type: technology}
  - {slug: official, name: 官方, type: provenance}
  - {slug: community, name: 社区, type: provenance}
  - {slug: social, name: 社交媒体, type: channel}
  - {slug: product-update, name: 产品更新, type: signal}
  - {slug: pricing, name: Pricing, type: signal}
  - {slug: documentation, name: 文档变化, type: signal}
  - {slug: release, name: 发布动态, type: signal}
  - {slug: high-signal, name: 高信号页面, type: signal}
  - {slug: trend-watch, name: 趋势观察, type: signal}

targets:
  - slug: composio
    name: Composio
    type: company
    description: Agent 工具集成与资源层竞品
    priority: high
    enabled: true
    tags: [competitor, startup, agent-resource-layer, tool-integration, mcp, sdk]
    channels:
      - slug: composio-blog
        name: Official Blog
        type: blog
        collector: mcp
        url: https://composio.dev/blog
        interval_minutes: 60
        priority: high
        enabled: true
        tier: core
        tags: [official, product-update]
        tool_binding: firecrawl-page-scrape-v1
        fallbacks:
          - {collector: http}
      - slug: composio-twitter
        name: Official X
        type: twitter
        collector: mcp
        handle: composio
        url: https://x.com/composio
        interval_minutes: 180
        priority: high
        enabled: true
        tier: core
        tags: [official, social, product-update]
        tool_binding: twitter-user-timeline-v1
        config:
          resolved_user_id: "1710011976179728384"
          include_replies: false
          include_parent_tweet: true
      - slug: composio-pricing
        name: Pricing
        type: pricing
        collector: mcp
        url: https://composio.dev/pricing
        interval_minutes: 360
        priority: critical
        enabled: true
        tier: core
        tags: [official, pricing, high-signal]
        tool_binding: firecrawl-page-scrape-v1
        config:
          diff: true
        fallbacks:
          - {collector: http}
      - slug: composio-documentation
        name: Documentation
        type: documentation
        collector: mcp
        url: https://docs.composio.dev
        interval_minutes: 360
        priority: high
        enabled: true
        tier: core
        tags: [official, documentation, high-signal]
        tool_binding: firecrawl-site-map-v1
        config:
          map_limit: 500
          scrape_changed_pages_with: firecrawl-page-scrape-v1
          diff: true
        fallbacks:
          - {collector: http}
      - slug: composio-github
        name: GitHub Organization
        type: github-release
        collector: github_api
        url: https://github.com/ComposioHQ
        interval_minutes: 180
        priority: high
        enabled: true
        tier: core
        tags: [official, open-source, release]
        config:
          organization: ComposioHQ
          include_releases: true
          include_recent_commits: true
        fallbacks:
          - {collector: rss}
          - {collector: http}

  - slug: openai
    name: OpenAI
    type: company
    description: 模型、Agent 与开发者平台的核心厂商
    priority: critical
    enabled: true
    tags: [competitor, tech-giant, model-layer, agent-platform, developer-platform]
    channels:
      - slug: openai-news
        name: Official News RSS
        type: rss
        collector: rss
        url: https://openai.com/news/rss.xml
        interval_minutes: 60
        priority: high
        enabled: true
        tier: core
        tags: [official, product-update]
      - slug: openai-engineering
        name: OpenAI Engineering
        type: blog
        collector: rss
        url: https://openai.com/news/engineering/
        config:
          article_path_prefixes: [/index/]
          feed_url: https://openai.com/news/rss.xml
          include_categories: [Engineering]
        interval_minutes: 60
        priority: high
        enabled: true
        tier: core
        tags: [official, ai-engineering]
        fallbacks:
          - {collector: http}
      - slug: openai-developer-blog
        name: OpenAI Developer Blog
        type: blog
        collector: mcp
        url: https://developers.openai.com/blog/
        config:
          article_path_prefixes: [/blog/]
        interval_minutes: 60
        priority: high
        enabled: true
        tier: core
        tags: [official, ai-engineering, developer-platform]
        tool_binding: firecrawl-page-scrape-v1
        fallbacks:
          - {collector: http}
      - slug: openai-twitter
        name: Official X
        type: twitter
        collector: mcp
        handle: OpenAI
        url: https://x.com/OpenAI
        interval_minutes: 180
        priority: high
        enabled: true
        tier: core
        tags: [official, social, product-update]
        tool_binding: twitter-user-timeline-v1
        config:
          resolved_user_id: "4398626122"
          include_replies: false
          include_parent_tweet: true
      - slug: openai-api-changelog
        name: API Changelog
        type: changelog
        collector: mcp
        url: https://developers.openai.com/api/docs/changelog
        interval_minutes: 60
        priority: critical
        enabled: true
        tier: core
        tags: [official, release, documentation, high-signal]
        tool_binding: firecrawl-page-scrape-v1
        config:
          diff: true
        fallbacks:
          - {collector: http}
      - slug: openai-api-pricing
        name: API Pricing
        type: pricing
        collector: mcp
        url: https://developers.openai.com/api/docs/pricing
        interval_minutes: 360
        priority: critical
        enabled: true
        tier: core
        tags: [official, pricing, high-signal]
        tool_binding: firecrawl-page-scrape-v1
        config:
          diff: true
        fallbacks:
          - {collector: http}
      - slug: openai-github
        name: GitHub Organization
        type: github-release
        collector: github_api
        url: https://github.com/openai
        interval_minutes: 180
        priority: high
        enabled: true
        tier: core
        tags: [official, open-source, release]
        config:
          organization: openai
          include_releases: true
          include_recent_commits: true
        fallbacks:
          - {collector: rss}
          - {collector: http}
      - slug: openai-youtube
        name: YouTube
        type: youtube
        collector: mcp
        url: https://www.youtube.com/OpenAI
        interval_minutes: 720
        priority: normal
        enabled: false
        tier: supplemental
        tags: [official, product-update]
        tool_binding: youtube-search-v1
        config:
          query: OpenAI
          channel_only: true
      - slug: openai-reddit
        name: Reddit Community
        type: reddit
        collector: mcp
        url: https://www.reddit.com/r/OpenAI
        interval_minutes: 360
        priority: low
        enabled: false
        tier: supplemental
        tags: [community, social]
        tool_binding: reddit-subreddit-v1
        config:
          subreddit: OpenAI

