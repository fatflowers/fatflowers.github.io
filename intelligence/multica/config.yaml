version: 1
provider: multica-cloud
api_url: https://api.multica.ai

project:
  name: 个人信息站点
  repository: fatflowers/fatflowers.github.io
  working_directory: /Users/simon/Documents/GitHub/fatflowers.github.io
  execution_mode: in_place
  runtime_selector:
    platform: macOS
    host_role: mac-mini
    provider: codex

agent:
  name: Intelligence Operator
  instructions_file: intelligence/multica/agent-instructions.md
  skill_directory: intelligence/multica/skill
  access: only_me
  model: gpt-5.6-terra
  thinking_level: medium
  custom_args:
    - -c
    - 'model_provider="openai"'

autopilots:
  - id: collect-due
    name: Collect Due Channels
    mode: run_only
    schedule_ref: collect-due
    runbook: intelligence/multica/runbooks/collect-due.md
  - id: analyze-pending
    name: Analyze Pending Items
    mode: run_only
    schedule_ref: analyze-pending
    runbook: intelligence/multica/runbooks/analyze-pending.md
  - id: morning-intelligence
    name: Morning Intelligence
    mode: create_issue
    schedule_ref: morning-intelligence
    runbook: intelligence/multica/runbooks/morning-report.md
  - id: midday-high-signals
    name: Midday High Signals
    mode: create_issue_on_publish_or_failure
    schedule_ref: midday-high-signals
    runbook: intelligence/multica/runbooks/midday-report.md
  - id: evening-intelligence
    name: Evening Intelligence
    mode: create_issue
    schedule_ref: evening-intelligence
    runbook: intelligence/multica/runbooks/evening-report.md
  - id: weekly-strategic-review
    name: Weekly Strategic Review
    mode: create_issue
    schedule_ref: weekly-strategic-review
    runbook: intelligence/multica/runbooks/weekly-review.md
  - id: channel-health-review
    name: Channel Health Review
    mode: create_issue_on_actionable_change
    schedule_ref: channel-health-review
    runbook: intelligence/multica/runbooks/channel-health.md

desired_state: configured
actual_state: deployed
notes:
  - agent.model 与 agent.thinking_level 是项目模型配置来源，嵌套 MCP 调用读取相同配置；变更后需同步 Multica Cloud Agent，不会自动继承 Cloud 界面的独立修改。
  - 不在 custom_args 重复设置 model 或 model_reasoning_effort，避免覆盖模型字段。嵌套调用仅允许显式 INTELLIGENCE_CODEX_MODEL / INTELLIGENCE_CODEX_REASONING_EFFORT 及 MCP 专用 INTELLIGENCE_MCP_MODEL / INTELLIGENCE_MCP_REASONING_EFFORT 环境变量覆盖；默认不启用，不自动回退到更昂贵模型。
  - 该文件是可迁移的声明，不保存 Multica 资源 ID 或凭据。
  - 平台返回的非敏感 ID 与验收证据记录在 deployment-status.yaml。
