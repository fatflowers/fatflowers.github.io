[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "personal-intelligence"
version = "0.1.0"
description = "Deterministic control plane for the personal intelligence pipeline"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
intelctl = "intelligence.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence"]

[tool.hatch.build.targets.wheel.shared-data]
"schemas/catalog.schema.json" = "share/personal-intelligence/catalog.schema.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
